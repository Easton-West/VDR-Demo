<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VDR // Vehicle Index</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <div class="scanlines"></div>


    <header class="topbar">

        <a class="brand"
           href="index.html">

            <span class="status-dot"></span>

            VDR // VEHICLE DATA REPOSITORY

        </a>


        <div class="system-status">

            DATABASE:
            <span>ONLINE</span>

        </div>

    </header>



    <main class="content">

        <div class="page-top-row">

			<div class="breadcrumbs">
				<a href="index.html">HOME</a>
				/
				<span id="categoryLabel">VEHICLES</span>
			</div>

			<div class="page-search">

				<form id="pageSearchForm">

					<input
						id="pageSearchInput"
						type="search"
						placeholder="SEARCH..."
						autocomplete="off"
					>

					<select id="pageSearchScope">

						<option value="page">THIS PAGE</option>
						<option value="global">GLOBAL</option>

					</select>

					<button type="submit">
						SEARCH
					</button>

				</form>

			</div>

		</div>



        <div class="page-heading">

            <div>

                <div class="eyebrow">
                    DATABASE INDEX
                </div>

                <h1 id="pageTitle">
                    VEHICLES
                </h1>

            </div>


            <div class="record-count"
                 id="recordCount">

            </div>

        </div>


        <div id="manufacturerList"
             class="manufacturer-list">

        </div>

    </main>



    <footer>

        <span>
            VDR SYSTEM // BUILD 0.1.0
        </span>

        <a href="index.html">
            ← RETURN TO MAIN INDEX
        </a>

    </footer>



    <script src="js/vehicles.js"></script>

</body>

</html>
